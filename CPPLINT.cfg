# This is the root directory of this project so stop cpplint from looking
# for settings in parent directories.
set noparent

# Use the C-standard allowlist to classify angle-bracket includes, giving
# more accurate build/include_order diagnostics than the default heuristic.
includeorder=standardcfirst

# Filters are grouped by category. Permanently disabled filters reflect
# deliberate ArduPilot code style decisions or embedded platform constraints.
# Before enabling any filter below, discuss on Discord or the developer forum
# and prepare a separate PR that fixes all existing violations first.
# Whitespace-only changes will not be accepted: ArduPilot uses astyle for
# formatting. See https://ardupilot.org/dev/docs/style-guide.html

# Build
filter=-build/c++11              # ArduPilot targets multiple C++ standards
filter=-build/header_guard       # ArduPilot uses #pragma once instead
filter=-build/include            # Too many false positives with ArduPilot's include layout
filter=-build/include_order      # Conflicts with ArduPilot include conventions
filter=-build/include_subdir     # ArduPilot library structure differs from cpplint's assumptions
filter=-build/include_what_you_use  # Too many false positives
filter=-build/namespaces         # ArduPilot uses namespaces in ways cpplint does not expect
filter=-build/storage_class      # Conflicts with ArduPilot code style

# Legal
filter=-legal/copyright          # ArduPilot files use various copyright headers

# Readability
# FIXME: enable readability/alt_tokens - bans alternative tokens (and, or, etc.) in favour of &&, ||
filter=-readability/alt_tokens
filter=-readability/braces       # Brace style is enforced by astyle, not cpplint
filter=-readability/casting      # C-style casts are common in ArduPilot embedded code
filter=-readability/check        # ArduPilot CHECK macros differ from cpplint's expectations
filter=-readability/inheritance  # ArduPilot uses inheritance patterns cpplint flags
filter=-readability/multiline_comment  # Multi-line C comments are common in ArduPilot
filter=-readability/multiline_string   # Multi-line strings are used intentionally
filter=-readability/namespace    # Namespace-closing comments are not required in ArduPilot
filter=-readability/todo         # ArduPilot TODOs do not follow cpplint's required format
filter=-readability/utf8         # ArduPilot has intentional non-ASCII characters

# Runtime
filter=-runtime/arrays           # C-style arrays are required for embedded targets (no std::vector)
# FIXME: enable runtime/casting - flags unsafe casts; ~10 existing violations to fix first
filter=-runtime/casting
# FIXME: enable runtime/explicit - prevents implicit constructor conversions; check existing violations first
filter=-runtime/explicit
# FIXME: enable runtime/int - encourages fixed-width integer types (already an ArduPilot guideline)
filter=-runtime/int
filter=-runtime/printf           # printf-style functions are appropriate for ArduPilot embedded code
filter=-runtime/threadsafe_fn    # ~40 existing instances; thread safety is handled by other mechanisms

# Whitespace
# The whitespace rules below are permanently disabled. ArduPilot has an
# established code style across millions of lines enforced by astyle.
# DO NOT open pull requests to change indentation, spacing or other whitespace.
filter=-whitespace/blank_line
filter=-whitespace/braces
filter=-whitespace/comma
filter=-whitespace/comments
filter=-whitespace/empty_loop_body
filter=-whitespace/end_of_line
filter=-whitespace/ending_newline
filter=-whitespace/forcolon
filter=-whitespace/indent
filter=-whitespace/indent_namespace
filter=-whitespace/line_length
filter=-whitespace/newline
filter=-whitespace/operators
filter=-whitespace/parens
filter=-whitespace/semicolon
filter=-whitespace/tab
filter=-whitespace/todo
